backend:
  name: github
  repo: praveenMadanayake/devlog
  branch: main

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Posts"
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    identifier_field: "title"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", hint: "One or two sentences — shown in the post list." }
      - { label: "Category", name: "category", widget: "select", options: ["containers", "git", "tooling"] }
      - { label: "Read time", name: "readTime", widget: "string", default: "5 min read" }
      - { label: "Publish date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Body", name: "body", widget: "markdown" }
